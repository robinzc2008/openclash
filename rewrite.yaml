  - {name: ♻️ 美国-自动,        type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 60,  filter: "美国-"}
  - {name: ♻️ 俄罗斯-自动,      type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 300, filter: "俄罗斯-"}

  - {name: ♻️ 台日新韩澳-自动,  type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 60,  filter: "台湾-|日本-|新加坡-|韩国-|澳-"}
  - {name: ♻️ 港台日新韩澳-自动,type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 60,  filter: "香港-|台湾-|日本-|新加坡-|韩国-|澳洲-"}

  - {name: ♻️ 东南亚-自动,      type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 100, filter: "新加坡-|越南-|泰国-|菲律宾-|马来西亚-|印度尼西亚-"}
  - {name: ♻️ 澳洲-自动,        type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 300, filter: "澳洲-"}

  - {name: ♻️ 欧洲-自动,        type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 300, filter: "德国-|英国-|法国-|意大利-|挪威-"}
  - {name: ♻️ 中东-自动,        type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 300, filter: "土耳其-|阿联酋-|尼日利亚-"}
  - {name: ♻️ 拉丁美洲-自动,    type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 300, filter: "巴西-|阿根廷-"}

  - name: 🌐 所有-自动
    type: url-test
    exclude-filter: *ai_exclude_isp
    include-all: true
    tolerance: 20
    interval: 300
    filter: "^(?!.*(直连|DIRECT|REJECT|拒绝)).*$"

# ========== 规则 & 规则集 ==========
rules:
  - RULE-SET,private_ip,直连
  - RULE-SET,private_domain,直连
  - RULE-SET,steamcn_domain,直连
  - RULE-SET,steam_domain,🕹️ Steam
  - DOMAIN-SUFFIX,robin.xin,直连
  - DOMAIN-SUFFIX,qichiyu.com,🚀 默认代理
  # AI 控制引用维护区，放在通用代理规则前，避免 AI 被通用规则抢先匹配。
  - *ai_udp_guard
  - RULE-SET,ai,🤖 AI
  - RULE-SET,proxylite,🚀 默认代理
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,apple_domain,直连
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💶 PayPal
  - RULE-SET,apple_ip,直连,no-resolve
  - RULE-SET,google_ip,🍀 Google,no-resolve
  - RULE-SET,netflix_ip,🎥 NETFLIX,no-resolve
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve
  - RULE-SET,geolocation-!cn,🚀 默认代理
  - RULE-SET,cn_domain,直连
  - RULE-SET,cn_ip,直连
  - MATCH,🐟 漏网之鱼

rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

