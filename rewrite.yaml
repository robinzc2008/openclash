# 适用于Sparkle的windows客户端，在sub-store整合了机场节点之后的覆写规则。
# ========== 全局设置 ==========
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# ========== AI 链式维护区 BEGIN（以后启用/换 ISP 只查找这里） ==========
# 当前状态：ISP 尚未购买，出口模板保持注释，🤖 AI 继续使用原来的候选。
# 启用后实际路径：设备 -> 🛫 AI 入口机场所选节点 -> AI-ISP出口 -> AI 网站。
# 入口手选：在 Sparkle 的「🛫 AI 入口机场」组中选择机场节点；
# 出口固定：「🤖 AI」启用后只有 AI-ISP出口，不配置直连/机场回退。
#
# 首次启用：
# 1. 在本维护区的 ISP 模板填好 server、SOCKS5 port 和认证信息，再取消模板的注释。
# 2. 将下面 ai_group 的 proxies 整行改成：proxies: [AI-ISP出口]
# 3. 将下面 udp_guard 改成注释中的 REJECT 版本，避免不支持 UDP 时绕到其他出口。
# 4. 保存并更新 Sparkle 覆写，在「🛫 AI 入口机场」选择可连接 ISP 的机场节点。
# 后续换 ISP：只更新本维护区 ISP 模板的地址、端口、认证；保留节点名称和 dialer-proxy。
# 停用链式：恢复 ai_group 的「原候选备份」，并将 udp_guard 的 REJECT 改回 🤖 AI。
# 原候选备份：[直连, 👆 手动选择节点, 🚊 IEPL专线, ♻️ 香港-自动, ♻️ 日本-自动, ♻️ 台湾-自动, ♻️ 新加坡-自动, ♻️ 韩国-自动, ♻️ 美国-自动, ♻️ 俄罗斯-自动, ♻️ 台日新韩澳-自动, ♻️ 港台日新韩澳-自动, ♻️ 东南亚-自动, ♻️ 澳洲-自动, ♻️ 欧洲-自动, ♻️ 中东-自动, ♻️ 拉丁美洲-自动, 🌐 所有-自动]
#
# 凭据注意：本仓库公开，不要把真实 username/password 提交到 GitHub！
# 推荐：公共文件只切换 ai_group；将 ISP 模板复制到 Sparkle 本地私有 YAML 覆写的
# +proxies 列表，填写认证信息并绑定同一订阅。各设备分别配置/私密同步该凭据覆写。
# 若在本地私有覆写定义了 ISP，公共文件中的 ISP 模板继续保持注释，避免同名节点重复。
# 账号密码认证需要 username/password；使用商家 IP 白名单认证时可删除这两个字段。
# 白名单必须允许前置机场连接 ISP 时使用的出口 IP；切换机场可能需要更新白名单。
#
# 覆盖范围：仍使用原来的 ai 域名规则集（category-ai-!cn），不是所有进程的所有请求。
# 普通应用组通过 *ai_exclude_isp 排除 ISP；下方的 *ai_group/*ai_entry 只是固定引用。
ai-anchor:
  exclude_isp: &ai_exclude_isp "^AI-ISP出口$"
  # 未启用时与原 AI 规则相同，不改变 UDP 去向。
  # 启用链式时改为：udp_guard: &ai_udp_guard "AND,((RULE-SET,ai),(NETWORK,UDP)),REJECT"
  # 这样 AI 的 UDP/QUIC 会被拒绝；支持 TCP 回退的请求可继续使用链式，语音等可能受限。
  # 仅在确认 ISP 与机场整条链路支持 UDP 后，才改回 🤖 AI 并把 ISP 的 udp 改成 true。
  udp_guard: &ai_udp_guard "AND,((RULE-SET,ai),(NETWORK,UDP)),🤖 AI"
  ai_group: &ai_group
    name: "🤖 AI"
    type: select
    # ISP 准备好后只将这一行改为：proxies: [AI-ISP出口]
    proxies: [直连, 👆 手动选择节点, 🚊 IEPL专线, ♻️ 香港-自动, ♻️ 日本-自动, ♻️ 台湾-自动, ♻️ 新加坡-自动, ♻️ 韩国-自动, ♻️ 美国-自动, ♻️ 俄罗斯-自动, ♻️ 台日新韩澳-自动, ♻️ 港台日新韩澳-自动, ♻️ 东南亚-自动, ♻️ 澳洲-自动, ♻️ 欧洲-自动, ♻️ 中东-自动, ♻️ 拉丁美洲-自动, 🌐 所有-自动]
  entry_group: &ai_entry
    name: "🛫 AI 入口机场"
    type: select
    include-all: true
    exclude-filter: *ai_exclude_isp
    exclude-type: "Direct|Reject"
    # 订阅没有机场节点时拒绝连接，避免退回直连。
    empty-fallback: REJECT

# 追加基础节点；ISP 模板与 AI 设置放在同一维护区，保持固定名称即可。
+proxies:
  - { name: 直连, type: direct }
  - { name: 拒绝, type: reject }
  # --- ISP 模板 BEGIN：未购买时整段保持注释 ---
  # - name: "AI-ISP出口"
  #   type: socks5
  #   server: ""              # 商家提供的代理 IP/域名
  #   port:                   # 商家提供的 SOCKS5 端口，填写整数
  #   username: ""            # 账号密码认证；真实凭据只放私有覆写
  #   password: ""            # 账号密码认证；真实凭据只放私有覆写
  #   udp: false              # 未确认商家支持 UDP 前保持关闭
  #   dialer-proxy: "🛫 AI 入口机场"
  # --- ISP 模板 END ---
# ========== AI 链式维护区 END ==========

# ========== 追加策略组（全部，Clash Party 写法） ==========
