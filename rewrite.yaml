  - {name: ♻️ 日本-自动,        type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 60,  filter: "日本-"}
  - {name: ♻️ 台湾-自动,        type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 60,  filter: "台湾-"}
  - {name: ♻️ 新加坡-自动,      type: url-test, exclude-filter: *ai_exclude_isp, include-all: true, tolerance: 20, interval: 60,  filter: "新加坡-"}
